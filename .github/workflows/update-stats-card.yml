name: Update NeetCode stats card

# Runs every time something is pushed to main (which is exactly when
# NeetCode's GitHub Sync commits a new submission), plus a manual button.
on:
  push:
    branches: [main]
    paths-ignore:
      - "neetcode-stats-card.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_neetcode_card.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add neetcode-stats-card.svg
          git diff --staged --quiet || git commit -m "chore: update NeetCode stats card"
          git push
